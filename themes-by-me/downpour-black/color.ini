; COLOR EXPLANATION
; main, sidebar, player = background
; main-elevated         = elevated content backgrounds
; sidebar-alt           = alternate sidebar background
; card                  = cards, tracklist, dropdowns, input fields
; text                  = primary text
; subtext               = secondary text and labels
; shadow                = text on button, tab active & selected row
; selected row          = selected song & tab
; button-active         = play button, outline on focused input
; button                = all other buttons
; button-disabled       = volume & seekbar background, scrollbar handle, borders
; highlight             = highlighted and hovered surfaces
; highlight-elevated    = highlights on elevated surfaces
; misc                  = miscellaneous UI accents
; notification          = notification accents
; notification-error    = error notification color
; tab-active            = active tab background
; banner-visibility     = banner visibility mask (FFFFFF = show, 000000 = hide)
; all-else              = self-explanatory

